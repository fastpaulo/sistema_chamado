<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <!-- Logotipo ou Ícone do Sistema -->
    <div class="flex justify-center text-blue-600">
      <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
    </div>
    <h2 class="mt-4 text-center text-3xl font-extrabold text-gray-900">
      Sistema de Chamados
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Faça login para acessar seu painel
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
      <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <!-- Campo de Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700"> Email corporativo </label>
          <div class="mt-1">
            <input id="email" type="email" formControlName="email" autocomplete="email"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                   [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-500': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">
          </div>
          <!-- Mensagem de erro do Email -->
          <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mt-2 text-sm text-red-600">
            Insira um email válido.
          </p>
        </div>

        <!-- Campo de Senha -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700"> Senha </label>
          <div class="mt-1">
            <input id="password" type="password" formControlName="password" autocomplete="current-password"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                   [ngClass]="{'border-red-500 focus:border-red-500 focus:ring-red-500': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
          </div>
          <!-- Mensagem de erro da Senha -->
          <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="mt-2 text-sm text-red-600">
            A senha deve ter no mínimo 6 caracteres.
          </p>
        </div>

        <!-- Opções extras -->
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" type="checkbox"
                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer">
            <label for="remember-me" class="ml-2 block text-sm text-gray-900 cursor-pointer"> Lembrar de mim </label>
          </div>

          <div class="text-sm">
            <a href="#" class="font-medium text-blue-600 hover:text-blue-500 transition-colors"> Esqueceu a senha? </a>
          </div>
        </div>

        <!-- Botão de Submit -->
        <div>
          <button type="submit"
                  routerLink="dashboard"
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
            Entrar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
