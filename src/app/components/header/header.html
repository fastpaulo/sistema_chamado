<header class="flex items-center justify-between px-6 py-4 bg-white border-b-4 border-blue-600">
  <div class="flex items-center">
    <button (click)="onToggleClick()" class="text-gray-500 focus:outline-none md:hidden">
      <!-- Ícone de Menu Hambúrguer para Mobile -->
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 6H20M4 12H20M4 18H11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="text-2xl font-semibold text-gray-700 hidden md:block">{{ title }}</h1>
  </div>
  <div class="flex items-center">
    <span class="text-sm font-medium text-gray-700 mr-4">Bem-vindo, {{ userName }}</span>
    <div class="h-9 w-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold shadow-sm">
      {{ userInitials }}
    </div>
  </div>
</header>
